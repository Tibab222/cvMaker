name: Code Quality Check (CI)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Code Style (Lint)
        run: npm run lint

      - name: Check TypeScript Types
        run: npm run typecheck